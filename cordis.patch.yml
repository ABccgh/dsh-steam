# dsh-steam — Steam tools for DeepSeek Harness
#
# 本文件既是 bundle 的 patch 层，也是这份插件的**运行时配置**。
# 真正被读取的是**安装副本**里的这一份（%USERPROFILE%\dsh-bundles\steam\cordis.patch.yml），
# 不是仓库里的这份——改配置要改副本。
#
# 改完需要**手动重载**（插件页把 steam 关开一次）：实测副本里的 patch 变更不会被 HMR
# 自动拾取。只改配置值不需要重启应用。
#
# 密钥不写在这里。Steam Web API Key 走凭据服务，与 DSH 自己的优先级一致（从高到低）：
#   1. 已存凭据：$DSH_HOME\.credentials.yaml 的 version: 1 的 refs: 下（最高优先，凭据服务热加载）
#   2. 启动 DSH 前的环境变量 —— setx STEAM_API_KEY "你的KEY"（需重启 DSH）
#   3. 项目 .env（<启动目录>\.env，只在启动时读一次）
#   4. $DSH_HOME\.env（最低优先，只在启动时读一次；桌面版还只在 cwd ≠ $DSH_HOME 时才读）
# 注意：.credentials.yaml 是带版本的结构化文档，不是 dotenv。直接加一行裸
# `STEAM_API_KEY: 你的KEY` 会被当作未知顶层键忽略，必须写成：
#   version: 1
#   refs:
#     STEAM_API_KEY: 你的KEY
# 也可以用凭据 UI 或 credentials.set 写入。不确定时看 steam_status 的「已配置／未配置」。
#
# webApi 取值：
#   on   （默认）—— 始终注册 5 个需要 Key 的工具；缺 Key 时调用会返回完整配置指引
#   auto          —— 能解析到 Key 才注册；激活时凭据服务若尚未就绪，插件会自动重试补注册，
#                    steam_status 也会顺手自愈一次
#   off           —— 永不注册
#
# trustSystemCa（auto/always/never）控制是否把系统根证书并入 Node 的默认 CA 列表，
# 用来兼容 Steam++ / Watt Toolkit 这类加速器的自签证书；auto 只在遇到证书错误时并入一次。
#
# 0.2.0 起评测走 api.steampowered.com/IUserReviewsService/GetAppReviews（免 Key）：
# 商店旧端点 store.steampowered.com/appreviews 已被 Valve 于 2026-10-22 停用。
- insert:
    - id: steam
      name: '@local/steam'
      config:
        steamPath: ''
        extraLibraryPaths: []
        webApi: on
        apiKeyEnv: STEAM_API_KEY
        trustSystemCa: auto
        storeCountry: cn
        storeLanguage: schinese
        requestTimeoutMs: 15000
        maxListedApps: 200
